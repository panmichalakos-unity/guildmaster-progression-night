# Quality gate (M0-007). Scope: quality checks only — release/export jobs
# arrive at EA prep (see docs/guildmaster-stack-and-tooling.md).
#
# Local/CI parity contract: every command here mirrors a documented local
# command (README.md "Commands" + CLAUDE.md). If you change one, change both.

name: quality

on: [push, pull_request]

jobs:
  lint:
    name: lint & seed checks (no engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit (pinned to local 4.5.x)
        run: pip install "gdtoolkit==4.5.*"
      - name: gdformat --check
        run: gdformat --check sim/ tests/ tools/smoke/
      - name: gdlint
        run: gdlint sim/ tests/ tools/smoke/
      - name: Seed integrity checks (stdlib only)
        run: python tools/seed_check.py

  test:
    name: godot headless tests & smokes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pin matches the local editor/CLI: Godot 4.7-stable (ADR-0006).
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - name: Import project (build .godot cache on fresh checkout)
        run: godot --headless --import
      # NOTE: no `godot --headless --quit` step here until M4-001 adds a main
      # scene — with no main scene the LINUX build exits 1 ("Can't run
      # project") while the Windows build exits 0, which broke this job (run
      # 28968513774). The -s smokes below load the project (scripts +
      # GDExtension) and exit deterministically, so project load IS covered.
      # TODO(M4-001): re-enable `godot --headless --quit` once a main scene exists.
      - name: Unit tests (GdUnit4)
        run: godot --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/
      - name: Migration smoke
        run: godot --headless -s tools/smoke/migrate_smoke.gd
      - name: Seed loader smoke
        run: godot --headless -s tools/smoke/seed_smoke.gd
      - name: Roster generation smoke
        run: godot --headless -s tools/smoke/roster_smoke.gd
      - name: Balance harness gate (M3-005)
        # asserts the difficulty-via-margin contract on real seeds: the 60-80%
        # band is reachable, win rates are monotone in gear, and the curve
        # spans decisive-wipe to one-shot (see tools/harness.gd header)
        run: godot --headless -s tools/harness.gd -- --pulls 100 --assert-winrate 0.6 0.8
