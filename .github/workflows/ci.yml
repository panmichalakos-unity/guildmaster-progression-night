# Quality gate (M0-007). Scope: quality checks only — release/export jobs
# arrive at EA prep (see docs/guildmaster-stack-and-tooling.md).
#
# Local/CI parity contract: every command here mirrors a documented local
# command (README.md "Commands" + CLAUDE.md). If you change one, change both.

name: quality

on: [push, pull_request]

jobs:
  lint:
    name: lint & seed checks (no engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit (pinned to local 4.5.x)
        run: pip install "gdtoolkit==4.5.*"
      - name: gdformat --check
        run: gdformat --check sim/ game/ tests/ tools/smoke/
      - name: gdlint
        run: gdlint sim/ game/ tests/ tools/smoke/
      - name: Seed integrity checks (stdlib only)
        run: python tools/seed_check.py

  test:
    name: godot headless tests & smokes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pin matches the local editor/CLI: Godot 4.7-stable (ADR-0006).
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - name: Import project (build .godot cache on fresh checkout)
        run: godot --headless --import
      - name: Project boot smoke (M4-001 app shell)
        # the main scene exists now: boots the shell headless for one frame
        run: godot --headless --quit
      - name: Unit tests (GdUnit4)
        run: godot --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/
      - name: Migration smoke
        run: godot --headless -s tools/smoke/migrate_smoke.gd
      - name: Seed loader smoke
        run: godot --headless -s tools/smoke/seed_smoke.gd
      - name: Roster generation smoke
        run: godot --headless -s tools/smoke/roster_smoke.gd
      - name: Vertical slice smoke (M4-005)
        run: godot --headless -s tools/smoke/slice_smoke.gd -- --seed 133742
      - name: Night One fun-gate smoke (MI-003)
        # the first session must TEACH: the default lineup fields a crittable main
        # tank, prep warns before the pull, pulling anyway is a tank_survival wall,
        # and benching the star tank turns it into a kill in a handful of pulls.
        # See docs/guildmaster-first-session.md — this is the fun gate itself.
        run: godot --headless -s tools/smoke/first_night_smoke.gd -- --seed 133742
      - name: Balance harness — per-boss contracts (MI-009)
        # Asserts EVERY boss against its own contract row (data/seeds/encounter_contract.csv):
        # the progression band at the gear it is FOR, the farm band at reachable BiS,
        # monotonicity in gear, and its dominant failure. This replaces a single global
        # band on boss 1 — the gate that passed green while three of four bosses sat at
        # a 0% win rate on gear the player could never assemble.
        run: godot --headless -s tools/harness.gd -- --pulls 150 --assert-contracts
      - name: Balance harness — prep leverage (MI-009)
        # Does raid prep DECIDE anything? Holds seed/roster/gear fixed and varies ONE
        # decision at a time. Fails if a prep control moves nothing anywhere (it is
        # administration, not tactics) or if a boss does not answer to its own
        # signature lever. This is the gate that caught healers being a TRAP on the
        # boss built around healing.
        run: godot --headless -s tools/harness.gd -- --probes --pulls 150
